name: tests

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v6

      # Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # .NET 11 is still in preview, so it needs its own step to ask for the preview quality
      - name: Setup .NET 11 SDK (preview)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # Invoke tests
      - name: Invoke tests
        working-directory: ./Tests/BlazingStory.Test
        run: dotnet test --output detailed

      # Invoke tests for the built-in addons
      - name: Invoke built-in addons tests
        working-directory: ./Tests/BlazingStory.Addons.BuiltIns.Test
        run: dotnet test --output detailed
